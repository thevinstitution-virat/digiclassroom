name: Contracts

# The sparse tokenizer is shared with PDLMS/Varta by specification, not by a
# package — the two repos reimplement the same algorithm and must agree exactly.
# A drift produces no error, only worse retrieval, so it has to be caught here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sparse-tokenizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:contracts

  # The SQL behind the chapter-upload page decides which book a chapter is stored in, so it is run against a real
  # Postgres built from the trio migrations, not trusted by reading it. Everything the script writes is rolled back.
  chapter-upload-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the trio database from its migrations
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE trio"
          # The migrations name these roles in OWNER TO / GRANT statements; the roles live in the real cluster.
          for role in content_app identity_app taxonomy_app vidyaverse_app pdlms_content_reader; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "CREATE ROLE $role"
          done
          psql -h localhost -U postgres -d trio -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION IF NOT EXISTS citext"
          for f in packages/core/src/lib/db/trio-migrations/0*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d trio -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null
          done
      - name: Run the chapter-upload SQL against it
        run: node scripts/verify-content-works.mjs
        env:
          CONTENT_DATABASE_URL: postgres://postgres:ci@localhost:5432/trio
