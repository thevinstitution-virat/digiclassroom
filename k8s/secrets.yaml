apiVersion: v1
kind: Secret
metadata:
  name: digiclassroom-secrets
  namespace: digiclassroom
  labels:
    app: digiclassroom-ai-tutor
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  OPENAI_API_KEY: <base64-encoded-openai-key>
  COHERE_API_KEY: <base64-encoded-cohere-key>
  ANTHROPIC_API_KEY: <base64-encoded-anthropic-key>
  QDRANT_API_KEY: <base64-encoded-qdrant-key>
  REDIS_PASSWORD: <base64-encoded-redis-password>
  JWT_SECRET: <base64-encoded-jwt-secret>
  ENCRYPTION_KEY: <base64-encoded-encryption-key>
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: digiclassroom
  labels:
    app: mysql
type: Opaque
data:
  # Base64 encoded database credentials
  MYSQL_ROOT_PASSWORD: <base64-encoded-root-password>
  MYSQL_PASSWORD: <base64-encoded-user-password>
  DATABASE_URL: <base64-encoded-database-url>
---
# Example of how to create secrets:
# kubectl create secret generic digiclassroom-secrets \
#   --from-literal=OPENAI_API_KEY=your-openai-key \
#   --from-literal=COHERE_API_KEY=your-cohere-key \
#   --from-literal=ANTHROPIC_API_KEY=your-anthropic-key \
#   --from-literal=QDRANT_API_KEY=your-qdrant-key \
#   --from-literal=REDIS_PASSWORD=your-redis-password \
#   --from-literal=JWT_SECRET=your-jwt-secret \
#   --from-literal=ENCRYPTION_KEY=your-encryption-key \
#   --namespace=digiclassroom
#
# kubectl create secret generic mysql-secrets \
#   --from-literal=MYSQL_ROOT_PASSWORD=your-root-password \
#   --from-literal=MYSQL_PASSWORD=your-user-password \
#   --from-literal=DATABASE_URL=mysql://user:password@mysql-service:3306/digiclassroom \
#   --namespace=digiclassroom
