apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-deployment
  namespace: digiclassroom
  labels:
    app: qdrant
    component: vector-database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        component: vector-database
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.7.4
        ports:
        - containerPort: 6333
          name: http
        - containerPort: 6334
          name: grpc
        env:
        - name: QDRANT__SERVICE__HTTP_PORT
          value: "6333"
        - name: QDRANT__SERVICE__GRPC_PORT
          value: "6334"
        - name: QDRANT__LOG_LEVEL
          value: "INFO"
        - name: QDRANT__SERVICE__ENABLE_CORS
          value: "true"
        - name: QDRANT__SERVICE__API_KEY
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: QDRANT_API_KEY
        - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS
          value: "4"
        - name: QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS
          value: "2"
        - name: QDRANT__STORAGE__WAL__WAL_CAPACITY_MB
          value: "64"
        - name: QDRANT__STORAGE__WAL__WAL_SEGMENTS_AHEAD
          value: "3"
        - name: QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB
          value: "200000"
        - name: QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD_KB
          value: "20000"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
        - name: qdrant-config
          mountPath: /qdrant/config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 6333
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 6333
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: qdrant-storage
        persistentVolumeClaim:
          claimName: qdrant-pvc
      - name: qdrant-config
        configMap:
          name: qdrant-config
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: digiclassroom
  labels:
    app: qdrant
spec:
  selector:
    app: qdrant
  ports:
  - port: 6333
    targetPort: 6333
    name: http
  - port: 6334
    targetPort: 6334
    name: grpc
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: digiclassroom
  labels:
    app: qdrant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd
