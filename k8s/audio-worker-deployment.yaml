apiVersion: apps/v1
kind: Deployment
metadata:
  name: digiclassroom-audio-worker
  labels:
    app: digiclassroom
    component: audio-worker
    phase: "5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digiclassroom
      component: audio-worker
  template:
    metadata:
      labels:
        app: digiclassroom
        component: audio-worker
    spec:
      containers:
      - name: audio-worker
        image: digiclassroom-pro:latest
        command: ["node", "dist/workers/audio-worker.js"]
        env:
        - name: WORKER_MODE
          value: "audio"
        - name: BULLMQ_QUEUE_NAME
          value: "audio-generation"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: redis-url
        - name: TTS_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: tts-service-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health/workers
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
