apiVersion: v1
kind: Namespace
metadata:
  name: digiclassroom
  labels:
    name: digiclassroom
    environment: production
    app: digiclassroom-ai-tutor
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: digiclassroom-quota
  namespace: digiclassroom
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: digiclassroom-limits
  namespace: digiclassroom
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
  - default:
      storage: "10Gi"
    type: PersistentVolumeClaim
