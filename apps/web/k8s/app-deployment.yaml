apiVersion: apps/v1
kind: Deployment
metadata:
  name: digiclassroom-app-deployment
  namespace: digiclassroom
  labels:
    app: digiclassroom-app
    component: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: digiclassroom-app
  template:
    metadata:
      labels:
        app: digiclassroom-app
        component: frontend
    spec:
      containers:
      - name: digiclassroom-app
        image: digiclassroom/ai-tutor:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: digiclassroom-config
              key: NODE_ENV
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: digiclassroom-config
              key: NEXT_PUBLIC_API_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: DATABASE_URL
        - name: QDRANT_URL
          valueFrom:
            configMapKeyRef:
              name: digiclassroom-config
              key: QDRANT_URL
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: QDRANT_API_KEY
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: digiclassroom-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: digiclassroom-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: REDIS_PASSWORD
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: OPENAI_API_KEY
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: COHERE_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: digiclassroom-secrets
              key: ANTHROPIC_API_KEY
        - name: APM_ENABLED
          valueFrom:
            configMapKeyRef:
              name: digiclassroom-config
              key: APM_ENABLED
        - name: USE_UNIFIED_PROMPTS
          valueFrom:
            configMapKeyRef:
              name: digiclassroom-config
              key: USE_UNIFIED_PROMPTS
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: digiclassroom-app-service
  namespace: digiclassroom
  labels:
    app: digiclassroom-app
spec:
  selector:
    app: digiclassroom-app
  ports:
  - port: 80
    targetPort: 3000
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: digiclassroom
  labels:
    app: digiclassroom-app
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: shared-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs-pvc
  namespace: digiclassroom
  labels:
    app: digiclassroom-app
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: shared-storage
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: digiclassroom-app-hpa
  namespace: digiclassroom
  labels:
    app: digiclassroom-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: digiclassroom-app-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
