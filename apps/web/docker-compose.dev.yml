# ============================================================================
# DigiClassroom Pro — Dev Infrastructure (services only, no app container)
# ============================================================================
# Ports chosen to avoid conflicts with Vidyaverse (3307, 6379, 9000)
# and PDLMS (3308, 6382, 6343).
#
# Usage:  docker compose -f docker-compose.dev.yml up -d
# ============================================================================

services:
  # ---------- MySQL 8.0 ----------
  mysql:
    image: mysql:8.0
    container_name: digiclassroom-mysql
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: virat_gyankosh
    volumes:
      - dc_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --bind-address=0.0.0.0
      --max_connections=500
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - digiclassroom-dev

  # ---------- Qdrant Vector DB ----------
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: digiclassroom-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - dc_qdrant_data:/qdrant/storage
      - ./qdrant_config:/qdrant/config
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__ENABLE_CORS: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "1"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 sh -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - digiclassroom-dev

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: digiclassroom-redis
    restart: unless-stopped
    ports:
      # 6381 is owned by PDLMS (pdlms_pro-redis-1); DCP uses 6382 to coexist.
      - "6382:6379"
    command: >
      redis-server
      --requirepass redis123
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - dc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - digiclassroom-dev

  # ---------- MinIO (S3-compatible) ----------
  minio:
    image: minio/minio:latest
    container_name: digiclassroom-minio
    restart: unless-stopped
    ports:
      - "9002:9000"   # API
      - "9003:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - dc_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - digiclassroom-dev

  # ---------- phpMyAdmin ----------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: digiclassroom-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - digiclassroom-dev

# ---------- Volumes ----------
volumes:
  dc_mysql_data:
    driver: local
  dc_qdrant_data:
    driver: local
  dc_redis_data:
    driver: local
  dc_minio_data:
    driver: local

# ---------- Network ----------
networks:
  digiclassroom-dev:
    driver: bridge
