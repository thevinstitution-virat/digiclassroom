# Docker Compose for Qdrant Vector Database
# Production-ready setup for DigiClassroom

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: digiclassroom-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API (optional)
    volumes:
      - ./qdrant_data:/qdrant/storage
      - ./qdrant_config:/qdrant/config
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__ENABLE_CORS=true
      # Performance optimizations
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
      - QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS=2
      - QDRANT__STORAGE__WAL__WAL_CAPACITY_MB=32
      - QDRANT__STORAGE__WAL__WAL_SEGMENTS_AHEAD=2
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:6333/collections" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - qdrant-network
  # Note: Qdrant Web UI removed due to image availability issues
  # Access Qdrant directly via API at http://localhost:6333

volumes:
  qdrant_storage:
    driver: local

networks:
  qdrant-network:
    driver: bridge

