# PDF-Extract-Kit Configuration for DigiClassroom
# This configuration defines the models and tasks for document processing

# Task configurations
tasks:
  # Layout Detection - Identifies document structure
  layout_detection:
    model: layout_detection_yolo
    model_config:
      model_path: models/Layout/YOLO/doclayout_yolo_ft.pt
      conf_threshold: 0.25
      iou_threshold: 0.45
      device: cuda  # GPU enabled - NVIDIA GeForce GTX 1660 SUPER (6GB)

  # Formula Detection - Locates mathematical formulas
  formula_detection:
    model: formula_detection_yolo
    model_config:
      model_path: models/MFD/YOLO/yolov8_ft.pt
      conf_threshold: 0.25
      iou_threshold: 0.45
      device: cuda  # GPU enabled

  # Formula Recognition - Converts formula images to LaTeX
  formula_recognition:
    model: unimernet
    model_config:
      model_path: models/MFR/unimernet_small
      device: cuda  # GPU enabled
      precision: fp32

  # OCR - Optical Character Recognition
  ocr:
    model: paddleocr
    model_config:
      lang: en
      use_angle_cls: true
      use_gpu: true  # GPU enabled
      show_log: false
      det_db_thresh: 0.3
      det_db_box_thresh: 0.5

  # Table Parsing - Extracts table structure
  table_parsing:
    model: struct_eqtable
    model_config:
      model_path: models/TabRec/StructEqTable
      device: cuda  # GPU enabled (required for StructTable-InternVL2-1B)

# Input/Output settings
inputs:
  pdf_dir: ./input_pdfs
  image_dir: ./input_images
  
outputs:
  output_dir: ./outputs
  save_images: false
  save_json: true
  save_markdown: true

# Processing options
processing:
  batch_size: 1
  max_pages: 500
  dpi: 200
  image_format: png
  
# Performance settings
performance:
  num_workers: 1
  memory_limit_gb: 4
  timeout_seconds: 10800  # 3 hours

